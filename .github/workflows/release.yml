name: Release

# Every push to the default branch ships a release, which is what the in-app updater
# polls. Put "[skip release]" in a commit message to push without cutting one.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# Releases must not race: two concurrent runs would fight over the version numbering.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest

    # The build reads its configuration from the environment; locally the same names come
    # from a .env file. See .env.example.
    env:
      APP_GITHUB_OWNER: ${{ github.repository_owner }}
      APP_GITHUB_REPO: ${{ github.event.repository.name }}
      APP_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.APP_GITHUB_OAUTH_CLIENT_ID }}
      APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
      APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
      APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify required secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing APP_KEYSTORE_BASE64"
          for name in APP_KEYSTORE_PASSWORD APP_KEY_ALIAS APP_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Run scripts/setup-release.sh to create the keystore and set them."
            echo "Updates only install over an existing build when every release is signed"
            echo "with the same key, so an unsigned or ad-hoc-signed release is not useful."
            exit 1
          fi
          if [ -z "$APP_GITHUB_OAUTH_CLIENT_ID" ]; then
            echo "::error::Missing repository secret: APP_GITHUB_OAUTH_CLIENT_ID"
            echo "Signing in with GitHub is the only way the app can read this private"
            echo "repository's releases, and that needs an OAuth app's client id. Create one"
            echo "at https://github.com/settings/developers with Device Flow enabled, then:"
            echo "  gh secret set APP_GITHUB_OAUTH_CLIENT_ID -R ${{ github.repository }}"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "APP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out the version
        id: version
        run: |
          # run_number only ever increases for a given workflow, which is exactly what
          # versionCode requires: Android refuses to install a lower code over a higher one.
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.$VERSION_CODE"
          {
            echo "code=$VERSION_CODE"
            echo "name=$VERSION_NAME"
            echo "tag=v$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"
          {
            echo "APP_VERSION_CODE=$VERSION_CODE"
            echo "APP_VERSION_NAME=$VERSION_NAME"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Collect artefacts
        id: artefacts
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          cp "$APK" "dist/nutrition-${{ steps.version.outputs.name }}.apk"

          MAPPING=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "dist/mapping-${{ steps.version.outputs.name }}.txt"
          fi

          # The signing certificate must be identical in every release or the update will be
          # rejected on device, so record it where it can be compared run to run.
          # keytool only reads v1 JAR signatures; with minSdk 26 the APK is v2/v3 signed,
          # so ask apksigner instead.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify "dist/nutrition-${{ steps.version.outputs.name }}.apk"
          FINGERPRINT=$("$APKSIGNER" verify --print-certs \
            "dist/nutrition-${{ steps.version.outputs.name }}.apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: $FINGERPRINT"
          ls -la dist

      - name: Write release notes
        id: notes
        run: |
          {
            # The app reads this marker to decide whether a release is newer than the
            # build the user has installed. Keep it on its own line.
            echo "versionCode: ${{ steps.version.outputs.code }}"
            echo
            git log -1 --pretty=format:'%s' "${{ github.sha }}"
            echo
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` · signing SHA-256 \`${{ steps.artefacts.outputs.fingerprint }}\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            --latest \
            --target "${{ github.sha }}" \
            dist/*
