name: Release

# Every push ships a release, which is what the in-app updater polls:
#   master      -> a full release on the stable channel
#   development -> a pre-release on the development channel
# Put "[skip release]" in a commit message to push without cutting one.
on:
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: write

# Releases must not race: two concurrent runs would fight over the version numbering.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest

    # The build reads its configuration from the environment; locally the same names come
    # from a .env file. See .env.example.
    env:
      APP_GITHUB_OWNER: ${{ github.repository_owner }}
      APP_GITHUB_REPO: ${{ github.event.repository.name }}
      APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
      APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
      APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify required secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing APP_KEYSTORE_BASE64"
          for name in APP_KEYSTORE_PASSWORD APP_KEY_ALIAS APP_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Run scripts/setup-release.sh to create the keystore and set them."
            echo "Updates only install over an existing build when every release is signed"
            echo "with the same key, so an unsigned or ad-hoc-signed release is not useful."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          # Tolerate a value pasted with wrapping or stray whitespace, and say something
          # useful if the secret holds anything other than the encoded keystore.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::APP_KEYSTORE_BASE64 is not valid base64."
            echo "It must hold the *contents* of the base64 file produced by"
            echo "scripts/setup-release.sh — one long line — not a path to it."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                -storepass "$APP_KEYSTORE_PASSWORD" -alias "$APP_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The decoded keystore does not open with APP_KEYSTORE_PASSWORD / APP_KEY_ALIAS."
            echo "Re-run scripts/setup-release.sh and re-upload all four signing secrets together."
            exit 1
          fi
          echo "APP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out the version and channel
        id: version
        run: |
          # run_number only ever increases for a given workflow — across both branches,
          # since it is one workflow — which is exactly what versionCode requires: Android
          # refuses to install a lower code over a higher one, and a device on the
          # development channel must never be offered a stale build as an "update".
          VERSION_CODE="${{ github.run_number }}"

          # A pre-release keeps GitHub's own "Latest release" pointing at the newest stable
          # one, which is what someone installing the first copy by hand should land on.
          if [ "${{ github.ref_name }}" = "development" ]; then
            CHANNEL=development
            VERSION_NAME="1.0.$VERSION_CODE-dev"
            TAG="v$VERSION_NAME"
            RELEASE_FLAGS="--prerelease"
          else
            CHANNEL=stable
            VERSION_NAME="1.0.$VERSION_CODE"
            TAG="v$VERSION_NAME"
            RELEASE_FLAGS="--latest"
          fi

          {
            echo "code=$VERSION_CODE"
            echo "name=$VERSION_NAME"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "flags=$RELEASE_FLAGS"
          } >> "$GITHUB_OUTPUT"
          {
            echo "APP_VERSION_CODE=$VERSION_CODE"
            echo "APP_VERSION_NAME=$VERSION_NAME"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Collect artefacts
        id: artefacts
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          cp "$APK" "dist/nutrition-${{ steps.version.outputs.name }}.apk"

          MAPPING=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "dist/mapping-${{ steps.version.outputs.name }}.txt"
          fi

          # The signing certificate must be identical in every release or the update will be
          # rejected on device, so record it where it can be compared run to run.
          # keytool only reads v1 JAR signatures; with minSdk 26 the APK is v2/v3 signed,
          # so ask apksigner instead.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify "dist/nutrition-${{ steps.version.outputs.name }}.apk"
          FINGERPRINT=$("$APKSIGNER" verify --print-certs \
            "dist/nutrition-${{ steps.version.outputs.name }}.apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          # Guard against a silently debug-signed APK: if the build ever falls back, the
          # release would install nowhere and could never update an existing install.
          EXPECTED=$(keytool -list -v -keystore "$APP_KEYSTORE_FILE" -alias "$APP_KEY_ALIAS" \
            -storepass "$APP_KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: //p' | head -n1 \
            | tr -d ':' | tr 'A-Z' 'a-z')
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::The APK was not signed with the release keystore."
            echo "  apk:      $FINGERPRINT"
            echo "  keystore: $EXPECTED"
            exit 1
          fi

          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: $FINGERPRINT"
          ls -la dist

      - name: Write release notes
        id: notes
        run: |
          {
            # The app reads these markers to decide whether a release is newer than the
            # build the user has installed, and whether it belongs to the channel they
            # follow. Keep each on its own line.
            echo "versionCode: ${{ steps.version.outputs.code }}"
            echo "channel: ${{ steps.version.outputs.channel }}"
            echo
            git log -1 --pretty=format:'%s' "${{ github.sha }}"
            echo
            echo
            echo "Built from \`${{ github.ref_name }}\` · commit \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Signing SHA-256 \`${{ steps.artefacts.outputs.fingerprint }}\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            ${{ steps.version.outputs.flags }} \
            --target "${{ github.sha }}" \
            dist/*
